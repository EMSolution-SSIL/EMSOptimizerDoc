メタ情報:
  名称: EMSOptimizer 日英翻訳用語集
  バージョン: 1
  原文言語: ja
  翻訳先言語: en
  目的: EMSOptimizerのDocusaurusドキュメントをAIで英訳する際に、重要用語と表記を固定する。
  参照ページ:
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/docs/docs/getting-started/Introduction/
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/docs/docs/getting-started/core_concepts/
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/docs/docs/getting-started/opt_problem/
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/docs/docs/guides/optimization_config/
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/docs/docs/guides/machine_config/
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/docs/docs/guides/individual/
  - https://emsolution-ssil.github.io/EMSOptimizerDoc/docs/showcase/Dmodel/basic/
翻訳ルール:
- この用語集に掲載された日本語がEMSOptimizer固有の意味で使われている場合、本用語集を最優先する。
- 製品名、API名、クラス名、コマンド名、設定キー、ファイル名、パス、コードリテラルは翻訳しない。
- Markdown/MDX構造、front matterの機械的なキー、リンク先、コードブロック、インラインコード、数式記号、YAML/JSONキーを維持する。
- 通常の英文はsentence caseを基本とする。ただしEMSOptimizerの公式コアオブジェクト名は定義済みの大文字・小文字を維持する。
- 直訳よりも、数理最適化・CAE・電気機器分野で一般的な英語用語を優先する。
- EMSOptimizerのIndividualを指す「個体」は individual、「解候補」は candidate solution とする。
- 「評価値」は文脈で訳し分ける。目的関数値なら objective value、メトリクスなら metric value、scalar fitnessプロパティなら fitness を使用する。
- 「設計領域」は設定キー design_region と整合するよう design region とする。
- 本文中の「コンフィグ」は configuration とする。ただし設定ファイル名や設定キーは変更しない。
- CMA-ES、NSGA-II、MOEA/D、IPMSM、GUI、CLI、API、YAML、JSON等の標準的な略語は、原文が明示的に説明している場合を除いて展開しない。
- Docusaurusの `current.json` / `version-*.json` では、原則として各エントリの `message` だけを英訳し、キーと `description` は変更しない。
- JSON翻訳内の `{name}`、`{versionLabel}` 等のプレースホルダは名称・個数を完全に維持する。
